{{- range $roleName, $role := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" $ }}-{{ $roleName }}
  labels:
    {{- include "lens.labels" $ | nindent 4 }}
    lens.role: {{ $roleName }}
spec:
  replicas: {{ $role.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lens.fullname" $ }}
      lens.role: {{ $roleName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lens.fullname" $ }}
        lens.role: {{ $roleName }}
    spec:
      containers:
        - name: lens
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $role.profile }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $.Values.postgres.host }}:{{ $.Values.postgres.port }}/{{ $.Values.postgres.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $.Values.postgres.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.passwordSecretName }}
                  key: {{ $.Values.postgres.passwordSecretKey }}
          envFrom:
            - configMapRef:
                name: {{ include "lens.fullname" $ }}-config
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- with $.Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
