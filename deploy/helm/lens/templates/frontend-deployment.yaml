{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-frontend
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    lens.role: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lens.fullname" . }}
      lens.role: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lens.fullname" . }}
        lens.role: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: BACKEND_URL
              value: {{ .Values.frontend.backendUrl | default (printf "http://%s-api:%v" (include "lens.fullname" .) .Values.roles.api.service.port) | quote }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
{{- end }}
