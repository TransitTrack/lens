image:
  repository: lens
  tag: local
  pullPolicy: IfNotPresent

roles:
  api:
    profile: role-api
    replicaCount: 2
    service:
      enabled: true
      port: 8080
  ingester:
    profile: role-ingester
    replicaCount: 1
  feed-processor:
    profile: role-feed-processor
    replicaCount: 2
  predictor:
    profile: role-predictor
    replicaCount: 1

frontend:
  enabled: false   # optional: the Nuxt vehicle dashboard, disabled by default
  image:
    repository: lens-web
    tag: local
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
  # Backend GraphQL endpoint nginx proxies /graphql to. Empty (default) means
  # "use the in-cluster api Service" (see templates/frontend-deployment.yaml).
  backendUrl: ""

postgres:
  host: lens-postgres
  port: 5432
  database: explorer
  username: postgres
  passwordSecretName: lens-postgres
  passwordSecretKey: password

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# Escape hatch for mounting extension jars onto every role's classpath (see LOADER_PATH in the
# backend Dockerfile) — e.g. a ConfigMap or a shared PVC populated by a sidecar/initContainer.
extraVolumes: []
extraVolumeMounts: []
