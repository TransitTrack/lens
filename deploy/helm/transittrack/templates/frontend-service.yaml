{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transittrack.fullname" . }}-frontend
  labels:
    {{- include "transittrack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "transittrack.fullname" . }}
    transittrack.role: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
{{- end }}
