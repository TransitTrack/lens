            type: string
          description: Names of the GTFS files present in this revision's zip.
        rowCounts:
          description: Number of rows loaded per GTFS table.
        feedStartDate:
          anyOf:
          - type: string
          - type: 'null'
          description: Earliest service date covered by this revision's calendars, per feed_info/calendar.
        feedEndDate:
          anyOf:
          - type: string
          - type: 'null'
          description: Latest service date covered by this revision's calendars.
        validationSummary:
          anyOf:
          - $ref: '#/components/schemas/ValidationSummary'
          - type: 'null'
          description: Validation results from the most recent GTFS validator run against this revision, or null if it hasn't
            been validated.
        errorMessage:
          anyOf:
          - type: string
          - type: 'null'
          description: Failure detail when status is FAILED, or null otherwise.
      description: One ingest attempt (or draft) of a feed's GTFS data, with its validation and processing outcome.
      required:
