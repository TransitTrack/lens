openapi: 3.1.0
info:
  title: TransitTrack REST API
  version: 0.1.0-draft
  description: 'REST API for TransitTrack. Resources are flat: related resources are referenced by id and read through their
    own endpoints.'
servers:
- url: /api/v1
tags:
- name: GTFS
- name: AVL
- name: Predictions
- name: Reports
- name: Schedule
- name: Drafts
- name: Optimization
- name: AvlFeedCatalog
paths:
  /avl-feeds:
    get:
      operationId: avlFeeds
      tags:
      - AvlFeedCatalog
      summary: Every configured AVL (vehicle-position) feed, with its decode/match configuration and last poll outcome.
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvlFeed'
          headers:
            X-Total-Count:
              description: Total matching rows before pagination.
              required: true
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /avl-feeds/{feedCode}/vehicles:
    get:
      operationId: vehicles
      tags:
      - AVL
      summary: Vehicles currently reporting on this feed, from each vehicle's latest known state rather than raw history.
        Set matchedOnly to only return vehicles currently matched to a trip.
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      - name: matchedOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
          headers:
            X-Total-Count:
              description: Total matching rows before pagination.
              required: true
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /avl-feeds/{feedCode}/vehicles/{vehicleId}:
    get:
      operationId: vehicle
      tags:
      - AVL
      summary: A single vehicle's latest known state, or null if the feed or vehicle is unknown.
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /avl-feeds/{feedCode}/vehicles/{vehicleId}/reports:
    get:
      operationId: avlReports
      tags:
      - AVL
      summary: Raw AVL report history for one vehicle, newest first. since is an ISO-8601 instant; omit it to return the most
        recent reports up to limit.
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvlReport'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /avl-feeds/{feedCode}/report-catalog:
    get:
      operationId: avlReportCatalog
      tags:
      - AVL
      summary: The feed's configured time zone and every distinct vehicle ID it has ever reported, for populating report-browsing
        filters.
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvlReportCatalog'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /avl-feeds/{feedCode}/vehicles/{vehicleId}/report-page:
    get:
      operationId: avlReportPage
      tags:
      - AVL
      summary: A page of raw AVL reports for one vehicle within a local time-of-day window (startTime/endTime) on a given
        date.
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: true
        schema:
          type: string
      - name: startTime
        in: query
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvlReportPage'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /revision-comparisons:
    get:
      operationId: compareRevisions
      tags:
      - Schedule
      summary: 'Diffs one revision''s derived schedule against another''s: trip and calendar changes, plus headway deltas.
        Scope with routeId/directionId/serviceId; tripChanges is paginated via offset/limit while tripChangeCount reports
        the unpaginated total.'
      parameters:
      - name: fromRevisionId
        in: query
        required: true
        schema:
          type: string
      - name: toRevisionId
        in: query
        required: true
        schema:
          type: string
      - name: routeId
        in: query
        required: false
        schema:
          type: string
      - name: directionId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: serviceId
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleComparison'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts:
    get:
      operationId: drafts
      tags:
      - GTFS
      summary: Drafts (revisions with kind DRAFT), newest first. Pass feedCode to scope to one feed.
      parameters:
      - name: feedCode
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Draft'
          headers:
            X-Total-Count:
              description: Total matching rows before pagination.
              required: true
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: forkDraft
      tags:
      - Drafts
      summary: Creates a new draft forked from a revision (the feed's active one if baseRevisionId is omitted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkDraftInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /drafts/{id}:
    get:
      operationId: draft
      tags:
      - GTFS
      summary: A single draft by ID, or null if unknown.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      operationId: discardDraft
      tags:
      - Drafts
      summary: Permanently deletes a draft and its edit history. Returns false if id is unknown. editor must hold the draft's
        edit lock.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/edits:
    get:
      operationId: draftEdits
      tags:
      - GTFS
      summary: A draft's edit history, newest first, including undone edits.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DraftEdit'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /draft-jobs/{jobId}:
    get:
      operationId: draftJob
      tags:
      - GTFS
      summary: Status of an async rebuildDraft job, or null if jobId is unknown (e.g. it has aged out of the in-memory job
        registry).
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftJob'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{draftId}/grid:
    get:
      operationId: draftGrid
      tags:
      - GTFS
      summary: A draft's editable trip/stop-time grid for one route/direction/service, for the schedule editor UI.
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
      - name: routeId
        in: query
        required: true
        schema:
          type: string
      - name: directionId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: serviceId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftGrid'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/rebuilds:
    post:
      operationId: rebuildDraft
      tags:
      - Drafts
      summary: Asynchronously re-derives a draft's schedule data and re-validates it. Returns a DraftJob to poll via draftJob.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftJob'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/revert:
    post:
      operationId: revertDraftToFork
      tags:
      - Drafts
      summary: Discards all edits since the draft was forked, resetting it back to its base revision's data.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/activation:
    post:
      operationId: activateDraft
      tags:
      - Drafts
      summary: Promotes a draft to be the feed's active revision. Fails if the draft has unresolved validation errors unless
        force is true.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
                force:
                  type: boolean
                  default: false
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/editor-lock/claim:
    post:
      operationId: claimDraftEditor
      tags:
      - Drafts
      summary: Acquires the draft's exclusive edit lock for editor. Fails if another editor holds it, unless takeOver is true.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
                takeOver:
                  type: boolean
                  default: false
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLock'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/editor-lock/renew:
    post:
      operationId: renewDraftEditor
      tags:
      - Drafts
      summary: Extends the expiry of editor's existing lock on the draft.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftLock'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /drafts/{id}/editor-lock/release:
    post:
      operationId: releaseDraftEditor
      tags:
      - Drafts
      summary: Releases editor's lock on the draft. Returns false if editor does not hold it.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                editor:
                  type: string
              additionalProperties: false
              required:
              - editor
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /draft-edit-commands/update-stop-time:
    post:
      operationId: updateStopTime
      tags:
      - Drafts
      summary: Changes one scheduled stop time on a trip. Fails with a version conflict if expectedVersion no longer matches
        the draft's current version (see DraftDto.version / StaleDraftException).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStopTimeInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /draft-edit-commands/shift-trip:
    post:
      operationId: shiftTrip
      tags:
      - Drafts
      summary: Shifts every stop time of a trip by a fixed offset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftTripInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /draft-edit-commands/set-stop-dwell:
    post:
      operationId: setStopDwell
      tags:
      - Drafts
      summary: Sets how long a trip dwells at a stop by adjusting its departure relative to its arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStopDwellInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /draft-edit-commands/add-trip:
    post:
      operationId: addTrip
      tags:
      - Drafts
      summary: Adds a new trip to the draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTripInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /draft-edit-commands/duplicate-trip:
    post:
      operationId: duplicateTrip
      tags:
      - Drafts
      summary: Copies an existing trip under a new trip ID, with every stop time shifted by offsetSec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateTripInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters: []
  /draft-edit-commands/delete-trip:
    post:
      operationId: deleteTrip
      tags:
      - Drafts
      summary: deleteTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTripInput'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditResult'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
