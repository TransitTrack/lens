        ruleClass:
          type: string
          description: SPEC, INTEROP, QUALITY or ANALYTICS.
        entityType:
          type: string
          description: Feed, File, Agency, Stop, Route, Trip, Shape, Service, Fare, Transfer, Pathway, Level, ...
        entityId:
          anyOf:
          - type: string
          - type: 'null'
        serviceId:
          anyOf:
          - type: string
          - type: 'null'
          description: Set on trip-scoped findings.
        file:
          anyOf:
          - type: string
          - type: 'null'
          description: Source GTFS file, e.g. stop_times.txt.
        line:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: 1-based row in `file`.
        field:
          anyOf:
          - type: string
          - type: 'null'
        observedValue:
          anyOf:
          - type: string
          - type: 'null'
        expectedValue:
          anyOf:
          - type: string
          - type: 'null'
        details:
          description: Rule-specific context, e.g. distances or speeds.
        message:
          type: string
        remediation:
          type: string
      description: 'One analyzer finding on a specific GTFS entity (not rolled up per rule): where it is, what was

        observed versus expected, and how to fix it.'
      required:
