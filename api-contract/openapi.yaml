  /feeds/{feedCode}/geometry:
    get:
      operationId: feedGeometry
      tags:
      - Schedule
      summary: 'The feed''s whole network layer as one GeoJSON FeatureCollection (trip-pattern LineStrings, simplified to
        ~3 m, plus boarding-stop Points), gzip-compressed then base64-encoded. Each feature has a `kind` property: `pattern`
        or `stop`.'
      parameters:
      - name: feedCode
        in: path
        required: true
        schema:
          type: string
      - name: revisionId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/geo+json:
              schema:
                type: object
                required:
                - type
                - features
                properties:
                  type:
                    type: string
                    const: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - geometry
                      - properties
                      properties:
                        type:
                          type: string
                          const: Feature
                        geometry:
                          oneOf:
                          - type: object
                            required:
                            - type
                            - coordinates
                            properties:
                              type:
                                const: Point
                              coordinates:
                                type: array
                                minItems: 2
                                maxItems: 2
                                items:
                                  type: number
                          - type: object
                            required:
                            - type
                            - coordinates
                            properties:
                              type:
                                const: LineString
                              coordinates:
                                type: array
                                minItems: 2
                                items:
                                  type: array
                                  minItems: 2
                                  maxItems: 2
                                  items:
                                    type: number
                        properties:
                          type: object
                          additionalProperties: true
          headers:
            Content-Encoding:
              description: gzip when accepted by the client; otherwise omitted.
              schema:
                type: string
                enum:
                - gzip
            Vary:
              description: Includes Accept-Encoding.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
