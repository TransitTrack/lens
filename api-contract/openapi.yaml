    DraftKind:
      type: string
      enum:
      - IMPORT
      - DRAFT
    DraftJobState:
      type: string
      enum:
      - RUNNING
      - SUCCEEDED
      - FAILED
    DraftJobPhase:
      type: string
      enum:
      - DERIVING
      - VALIDATING
      - DONE
    Draft:
      type: object
      properties:
        id:
          type: string
        feedCode:
          type: string
        label:
          anyOf:
          - type: string
          - type: 'null'
          description: Operator-facing name for this draft, or null if unset.
        baseRevisionId:
          anyOf:
          - type: string
          - type: 'null'
          description: The revision this draft was forked from, or null if it predates fork tracking.
        status:
          $ref: '#/components/schemas/RevisionStatus'
        kind:
          $ref: '#/components/schemas/DraftKind'
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version, incremented by every edit mutation and required (as expectedVersion)
            by mutations and undo/redo to detect concurrent edits.
        derivationStale:
          type: boolean
          description: True if the draft has been edited since its last rebuildDraft, so its derived schedule data (and validation)
            may not reflect the latest edits.
        lastValidation:
          description: Validation results from the draft's last rebuildDraft, or null if it hasn't been rebuilt.
        lock:
          anyOf:
          - $ref: '#/components/schemas/DraftLock'
          - type: 'null'
          description: The current edit lock, or null if no editor currently holds it.
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          description: The editor who created this draft, or null if unknown.
        createdAt:
          type: string
        rowCounts:
          description: Row counts per GTFS table, as of the draft's data.
      description: 'A revision being edited: a fork of a base revision, plus its edit lock and validation state.'
      required:
      - id
      - feedCode
      - status
      - kind
      - version
      - derivationStale
      - createdAt
    DraftJob:
      type: object
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/DraftJobState'
        phase:
          $ref: '#/components/schemas/DraftJobPhase'
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Failure detail when state is FAILED, or null otherwise.
      description: Status of an asynchronous rebuildDraft job, pollable via the draftJob query.
      required:
      - id
      - state
      - phase
    DraftLock:
      type: object
      properties:
        editor:
          type: string
        expiresAt:
          type: string
          description: ISO-8601 instant the lock expires unless renewed via renewDraftEditor.
      description: The exclusive edit lock currently held on a draft.
      required:
      - editor
      - expiresAt
    DraftEdit:
      type: object
      properties:
        seq:
          type: integer
          format: int32
          description: Sequence number within the draft's edit history, increasing with each new edit.
        op:
          type: string
          description: Upper-snake-case code identifying the kind of edit (e.g. UPDATE_STOP_TIME, SHIFT_TRIP, ADD_TRIP).
        summary:
          type: string
          description: Human-readable summary of what this edit changed.
        appliedAt:
          type: string
        undone:
          type: boolean
          description: True if this edit has since been reverted via undoDraftEdit.
      description: One entry in a draft's edit history.
      required:
      - seq
      - op
      - summary
      - appliedAt
      - undone
    DraftEditResult:
      type: object
      properties:
        draft:
          $ref: '#/components/schemas/Draft'
        edit:
          anyOf:
          - $ref: '#/components/schemas/DraftEdit'
          - type: 'null'
          description: The edit this mutation recorded, or null for a mutation that doesn't produce an undoable edit.
        canUndo:
          type: boolean
        canRedo:
          type: boolean
      description: 'The result of an edit mutation: the draft''s new state, the edit record it produced, and whether undo/redo
        are now available.'
      required:
      - draft
      - canUndo
      - canRedo
    ForkDraftInput:
      type: object
      properties:
        feedCode:
          type: string
        baseRevisionId:
          anyOf:
          - type: string
          - type: 'null'
          description: Revision to fork from, or omit to fork the feed's current active revision.
        label:
          anyOf:
          - type: string
