          format: int32
        warningCount:
          type: integer
          format: int32
        notices:
          type: array
          items:
            $ref: '#/components/schemas/ValidationNotice'
          description: Individual validation findings, one per distinct rule/severity combination that fired, with how many
            rows it affected.
      description: Aggregate GTFS validation results for one revision.
      required:
      - errorCount
      - warningCount
      - notices
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFO
    ValidationNotice:
      type: object
      properties:
        rule:
          type: string
          description: The validator rule that fired (e.g. a MobilityData GTFS validator notice code).
        severity:
          $ref: '#/components/schemas/Severity'
        count:
          type: integer
          format: int32
          description: Number of rows this rule fired on.
        sample:
          type: string
          description: One example of an affected row, for diagnosing the issue.
      description: One distinct validation rule violation found in a revision, with a sample affected row.
      required:
      - rule
      - severity
      - count
      - sample
