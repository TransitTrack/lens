components:
  schemas:
    AvlFormat:
      type: string
      enum:
      - GTFS_RT
      - STPT
    AvlAssignmentMode:
      type: string
      enum:
      - TRUST_DESCRIPTOR
      - DESCRIPTOR_THEN_INFER
      - FULL_INFERENCE
    AvlOccupancyStatus:
      type: string
      enum:
      - EMPTY
      - MANY_SEATS_AVAILABLE
      - FEW_SEATS_AVAILABLE
      - STANDING_ROOM_ONLY
      - CRUSHED_STANDING_ROOM_ONLY
      - FULL
      - NOT_ACCEPTING_PASSENGERS
      - NO_DATA_AVAILABLE
      - NOT_BOARDABLE
    VehicleStopStatus:
      type: string
      enum:
      - INCOMING_AT
      - STOPPED_AT
      - IN_TRANSIT_TO
    MatchStatus:
      type: string
      enum:
      - PENDING
      - MATCHED
      - UNMATCHED
      - SKIPPED
    AvlFeed:
      type: object
      properties:
        code:
          type: string
          description: Unique identifier for this AVL feed, independent of the GTFS feed it matches against.
        name:
          type: string
        gtfsFeedCode:
          type: string
          description: The gtfs.graphqls Feed.code whose active revision this AVL feed's vehicles are matched against.
        format:
          $ref: '#/components/schemas/AvlFormat'
        pollIntervalSec:
          type: integer
          format: int32
          description: How often this feed is polled, in seconds.
        assignmentMode:
          $ref: '#/components/schemas/AvlAssignmentMode'
        predictionAlgorithms:
          type: array
          items:
            $ref: '#/components/schemas/PredictionAlgorithm'
          description: Prediction algorithms run for vehicles on this feed; the first is used as the default when a query
            doesn't specify one.
        enabled:
          type: boolean
        lastPollAt:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 instant of the most recent poll attempt, or null if this feed has never been polled.
        lastPollStatus:
          anyOf:
          - type: string
          - type: 'null'
          description: Outcome of the most recent poll attempt (e.g. success or an error description).
        lastPollReportCount:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Number of AVL reports ingested on the most recent poll.
      description: 'A configured AVL (vehicle-position) feed: where it''s polled from, how its reports are decoded, and how
        vehicles on it are matched to trips.'
      required:
      - code
      - name
      - gtfsFeedCode
      - format
      - pollIntervalSec
      - assignmentMode
      - predictionAlgorithms
      - enabled
    LatLon:
      type: object
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      required:
      - lat
      - lon
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
        label:
          anyOf:
          - type: string
          - type: 'null'
          description: Operator-facing label for the vehicle, if the feed provides one; often distinct from vehicleId.
        reportTs:
          type: string
          description: ISO-8601 instant this position was reported by the vehicle.
        position:
          $ref: '#/components/schemas/LatLon'
          description: Raw reported position.
        snappedPosition:
          anyOf:
          - $ref: '#/components/schemas/LatLon'
          - type: 'null'
          description: Position snapped onto the matched trip's shape, or null while unmatched.
        bearing:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Compass heading in degrees, if reported.
        speedMps:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        occupancyStatus:
          anyOf:
          - $ref: '#/components/schemas/AvlOccupancyStatus'
          - type: 'null'
        matched:
          type: boolean
          description: True once this vehicle has been matched to a trip.
        stale:
          type: boolean
          description: True if this vehicle's last report is older than the feed considers live; the position shown may no
            longer reflect where the vehicle actually is.
        scheduleAdherenceSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Seconds behind (positive) or ahead of (negative) schedule at the matched position, or null while unmatched.
        stopPathIndex:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Index into the matched trip pattern's stopPaths the vehicle is currently progressing through, or null
            while unmatched.
        distanceAlongTripM:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Distance in meters the vehicle has traveled along its matched trip's shape, or null while unmatched.
        revisionId:
          anyOf:
          - *id004
          - type: 'null'
          description: GTFS revision the vehicle is matched against; pass it as revisionId when reading its trip or stop,
            or null while unmatched.
        tripId:
          anyOf:
          - *id004
          - type: 'null'
          description: GTFS trip_id of the matched trip (read it via the trips endpoint), or null while unmatched.
        currentStopId:
          anyOf:
          - *id004
          - type: 'null'
          description: GTFS stop_id of the stop the vehicle is currently at or approaching, or null while unmatched.
      description: A vehicle's latest known position and match state on an AVL feed, updated on every poll.
      required:
      - vehicleId
      - reportTs
      - position
      - matched
      - stale
    AvlReport:
      type: object
      properties:
        vehicleId:
          type: string
        ts:
          type: string
          description: ISO-8601 instant the vehicle itself reported this position.
        processedAt:
          type: string
          description: ISO-8601 instant this report was ingested by transittrack.
        source:
          $ref: '#/components/schemas/AvlFormat'
          description: The AVL feed protocol this report was decoded from.
        position:
          $ref: '#/components/schemas/LatLon'
        bearing:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        speedMps:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        currentStatus:
          anyOf:
          - $ref: '#/components/schemas/VehicleStopStatus'
          - type: 'null'
        occupancyStatus:
          anyOf:
          - $ref: '#/components/schemas/AvlOccupancyStatus'
          - type: 'null'
        descTripId:
          anyOf:
          - type: string
          - type: 'null'
          description: The trip ID the feed itself reported for this vehicle (its raw descriptor), before any transittrack
            matching - null if the feed didn't supply one.
        matchStatus:
          $ref: '#/components/schemas/MatchStatus'
        match:
          anyOf:
          - $ref: '#/components/schemas/AvlReportMatch'
          - type: 'null'
          description: The resolved trip match, present only when matchStatus is MATCHED.
      description: One raw AVL (vehicle-position) report as received from the feed, plus the outcome of matching it to a trip.
      required:
      - vehicleId
      - ts
      - processedAt
      - source
      - position
      - matchStatus
    AvlReportCatalog:
      type: object
      properties:
        timeZone:
          type: string
          description: IANA time zone the feed's agency operates in, used to interpret avlReportPage's date/startTime/endTime.
        vehicleIds:
          type: array
          items:
            type: string
          description: Every distinct vehicle ID this feed has ever reported.
      required:
      - timeZone
      - vehicleIds
    AvlReportPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvlReport'
        totalCount:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
      description: A page of AvlReport rows for one vehicle within a requested time window.
      required:
      - items
      - totalCount
      - page
      - pageSize
    AvlReportMatch:
      type: object
      properties:
        stopPathIndex:
          type: integer
          format: int32
          description: Index into the matched trip pattern's stopPaths this report's position falls within.
        distanceAlongTripM:
          type: number
          format: double
          description: Distance in meters along the matched trip's shape.
        deviationM:
          type: number
          format: double
          description: Perpendicular distance in meters between the raw reported position and the matched shape.
        scheduleAdherenceSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Seconds behind (positive) or ahead of (negative) schedule at this position.
        heading:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Heading in degrees inferred from the match, independent of any bearing the feed itself reported.
        score:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Match confidence score; higher is a stronger match. Not comparable across matcher implementations.
        snappedPosition:
          $ref: '#/components/schemas/LatLon'
          description: The raw position snapped onto the matched trip's shape.
        revisionId:
          type: string
          description: GTFS revision the report was matched against.
        tripId:
          type: string
          description: GTFS trip_id of the matched trip.
      description: The resolved trip match for an AvlReport whose matchStatus is MATCHED.
      required:
      - stopPathIndex
      - distanceAlongTripM
      - deviationM
      - snappedPosition
      - revisionId
      - tripId
    ScheduleComparison:
      type: object
      properties:
        fromRevisionId:
          type: string
        toRevisionId:
          type: string
        fromDerivationStale:
          type: boolean
          description: True if fromRevisionId's derived schedule data is stale (needs a rebuild) at the time of comparison.
        toDerivationStale:
          type: boolean
        tripChangeCount:
          type: integer
          format: int32
          description: Total number of trip changes found, independent of tripChanges' offset/limit pagination.
        tripChanges:
          type: array
          items:
            $ref: '#/components/schemas/TripChange'
          description: A page of the trip-level changes, per the query's offset/limit.
        calendarChanges:
          type: array
          items:
            $ref: '#/components/schemas/CalendarChange'
        headwaySummaries:
          type: array
          items:
            $ref: '#/components/schemas/HeadwaySummary'
          description: Per-route/direction/service headway comparison between the two revisions.
      description: The result of diffing two GTFS revisions' derived schedules.
      required:
      - fromRevisionId
      - toRevisionId
      - fromDerivationStale
      - toDerivationStale
      - tripChangeCount
      - tripChanges
      - calendarChanges
      - headwaySummaries
    TripChangeKind:
      type: string
      enum:
      - ADDED
      - REMOVED
      - MODIFIED
    StopChangeKind:
      type: string
      enum:
      - STOP_ADDED
      - STOP_REMOVED
      - STOP_TIME_CHANGED
    CalendarChangeKind:
      type: string
      enum:
      - ADDED
      - REMOVED
      - MODIFIED
    ExceptionChangeKind:
      type: string
      enum:
      - EXCEPTION_ADDED
      - EXCEPTION_REMOVED
      - EXCEPTION_CHANGED
    TripChange:
      type: object
      properties:
        tripId:
          type: string
        kind:
          $ref: '#/components/schemas/TripChangeKind'
        fieldChanges:
          description: Changed top-level trip fields, keyed by field name to {from, to} old/new value pairs.
        stopChanges:
          type: array
          items:
            $ref: '#/components/schemas/StopTimeChange'
          description: Per-stop changes within this trip.
        runTimeDeltaSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Change in the trip's total scheduled run time in seconds (toRevisionId minus fromRevisionId), or null
            for an added/removed trip.
      description: One trip's change between the two compared revisions.
      required:
      - tripId
      - kind
      - fieldChanges
      - stopChanges
    StopTimeChange:
      type: object
      properties:
        stopSequence:
          type: integer
          format: int32
        kind:
          $ref: '#/components/schemas/StopChangeKind'
        stopId:
          anyOf:
          - type: string
          - type: 'null'
          description: The stop involved, or null for a STOP_TIME_CHANGED entry that didn't change which stop is at this sequence.
        arrivalDeltaSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Change in scheduled arrival time in seconds, or null if not applicable.
        departureDeltaSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
      description: One scheduled stop's change within a changed trip.
      required:
      - stopSequence
      - kind
    CalendarChange:
      type: object
      properties:
        serviceId:
          type: string
        kind:
          $ref: '#/components/schemas/CalendarChangeKind'
        fieldChanges:
          description: Changed top-level calendar fields (day-of-week flags, startDate, endDate), keyed by field name to {from,
            to} old/new value pairs.
        exceptionChanges:
          type: array
          items:
            $ref: '#/components/schemas/CalendarExceptionChange'
          description: Calendar date exceptions added, removed, or changed for this service.
      description: One calendar's change between the two compared revisions.
      required:
      - serviceId
      - kind
      - fieldChanges
      - exceptionChanges
    CalendarExceptionChange:
      type: object
      properties:
        date:
          type: string
        kind:
          $ref: '#/components/schemas/ExceptionChangeKind'
        fromType:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: The exception_type (1=added, 2=removed) before this change, or null if it didn't previously exist.
        toType:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: The exception_type after this change, or null if it was removed.
      description: One calendar date exception's change within a changed calendar.
      required:
      - date
      - kind
    HeadwaySummary:
      type: object
      properties:
        routeId:
          type: string
        directionId:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        serviceId:
          type: string
        fromTripCount:
          type: integer
          format: int32
        toTripCount:
          type: integer
          format: int32
        fromMeanGapSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Mean gap between consecutive trips in fromRevisionId, in seconds.
        toMeanGapSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        fromMaxGapSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Largest gap between consecutive trips in fromRevisionId, in seconds.
        toMaxGapSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
      description: Scheduled headway comparison for one route/direction/service between the two compared revisions.
      required:
      - routeId
      - serviceId
      - fromTripCount
      - toTripCount
    DraftGrid:
      type: object
      properties:
