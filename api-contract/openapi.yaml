        supersededAt:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 instant this revision was superseded by a later activation, or null if it hasn't been.
        contentSha256:
          anyOf:
          - type: string
          - type: 'null'
          description: SHA-256 of the downloaded GTFS zip, used to detect byte-identical re-ingests (see RevisionStatus.UNCHANGED).
        byteSize:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Size of the downloaded GTFS zip in bytes.
        filesPresent:
          type: array
