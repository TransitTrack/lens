          $ref: '#/components/schemas/OptimizationRunState'
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Failure detail when state is FAILED, or null otherwise.
        createdAt:
          type: string
        completedAt:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 instant the run finished (successfully or not), or null while still QUEUED/RUNNING.
      description: One asynchronous schedule-optimization analysis, frozen to the feed's active revision at submission time.
      required:
      - id
      - revisionId
      - state
      - createdAt
    OptimizationRecommendation:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/OptimizationRecommendationKind'
        status:
          $ref: '#/components/schemas/OptimizationRecommendationStatus'
        sampleCount:
          type: integer
          format: int32
          description: Number of observed samples this recommendation is based on.
        deltaSec:
          type: integer
          format: int32
          description: Proposed change in seconds, signed by kind (e.g. a stop-time or trip-start adjustment).
        currentValue:
          description: The current schedule value(s) this recommendation would change.
        proposedValue:
          description: The proposed replacement value(s).
        evidence:
          description: Supporting observed-data detail behind this recommendation.
        reason:
          type: string
          description: Human-readable explanation of why this recommendation was made.
      description: One proposed schedule adjustment produced by an optimization run, backed by observed AVL evidence.
      required:
      - id
      - kind
      - status
      - sampleCount
      - deltaSec
      - currentValue
      - proposedValue
      - evidence
      - reason
    PredictionDayType:
      type: string
      enum:
      - WEEKDAY
      - SATURDAY
      - SUNDAY
    PredictionTimeBand:
      type: string
      enum:
      - NIGHT
      - MORNING_PEAK
      - MIDDAY
      - AFTERNOON_PEAK
      - EVENING
    PredictionAlgorithm:
      type: string
      enum:
      - SCHEDULE_ADHERENCE
      - HISTORICAL_AVERAGE
      - KALMAN
    StopPrediction:
      type: object
      properties:
        stopPathIndex:
          type: integer
          format: int32
          description: Index into the trip pattern's stopPaths this prediction is for.
        scheduledArrival:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 instant of the scheduled arrival, or null if the trip has no scheduled arrival at this stop.
        scheduledDeparture:
          anyOf:
          - type: string
          - type: 'null'
        actualArrival:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 GPS-interpolated arrival, present once the stop has been reached.
        actualDeparture:
          anyOf:
          - type: string
          - type: 'null'
        predictedArrival:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 predicted arrival, retained after arrival for comparison with the actual.
        predictedDeparture:
          anyOf:
          - type: string
          - type: 'null'
        algorithm:
          anyOf:
          - $ref: '#/components/schemas/PredictionAlgorithm'
          - type: 'null'
          description: The algorithm that produced this prediction, or null for a stop already reached (no prediction was
            needed).
        confidenceSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Estimated arrival standard deviation in seconds (one SD), not a guaranteed confidence interval. Includes
            uncertainty of unlearned legs and ageing Kalman state.
        sourceReportTs:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 timestamp of the AVL observation used to generate this prediction, independent of processing
            time.
        actualReportGapSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Gap in seconds between GPS reports bracketing the actual crossing; null when unknown.
        actualReliable:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the actual crossing meets the configured report-gap quality limit; null when unknown.
        stopId:
          type: string
          description: GTFS stop_id of the stop this prediction is for.
      description: A predicted (and, once reached, actual) arrival/departure at one scheduled stop of a vehicle's current
        trip.
      required:
      - stopPathIndex
      - stopId
    PredictionAccuracySummary:
      type: object
      properties:
        algorithm:
          $ref: '#/components/schemas/PredictionAlgorithm'
        sampleCount:
          type: integer
          format: int32
          description: Available forecasts across eligible shared snapshots and all horizons.
        eligibleCount:
          type: integer
          format: int32
          description: Eligible shared snapshots, including missing forecasts. Only reliable actual crossings are scored.
        predictionCoverage:
          type: number
          format: double
          description: Available forecasts divided by eligibleCount; conditional on matched observations, not total scheduled
            service.
        pairedSampleCount:
          type: integer
          format: int32
          description: Snapshots where every compared algorithm produced a forecast. Error statistics use only these paired
            samples.
        meanErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean signed error in seconds (actual minus predicted); positive means vehicles got there later than
            predicted.
        meanAbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean absolute error in seconds.
        p90AbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        p95AbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        confidenceCoverage:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Observed fraction of errors within the algorithm's one-SD spread, among available forecasts with a
            spread.
        confidenceSampleCount:
          type: integer
          format: int32
        byHorizon:
          type: array
          items:
            $ref: '#/components/schemas/PredictionAccuracyHorizon'
          description: The same statistics per lead-time horizon, shortest first.
      description: Aggregate prediction error for one algorithm over a recent time window. Each stop the vehicle reaches is
        scored once per lead-time horizon a prediction was made within, so the overall figures pool every horizon.
      required:
      - algorithm
      - sampleCount
      - eligibleCount
      - predictionCoverage
      - pairedSampleCount
      - confidenceSampleCount
      - byHorizon
    PredictionAccuracyHorizon:
      type: object
      properties:
        horizonSec:
          type: integer
          format: int32
        sampleCount:
          type: integer
          format: int32
        eligibleCount:
          type: integer
          format: int32
        predictionCoverage:
          type: number
          format: double
        pairedSampleCount:
          type: integer
          format: int32
        meanErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Mean signed error in seconds (actual minus predicted); positive means vehicles got there later than
            predicted.
        meanAbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        p90AbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        p95AbsErrorSec:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        confidenceCoverage:
          anyOf:
          - type: number
            format: double
          - type: 'null'
        confidenceSampleCount:
          type: integer
          format: int32
      description: Prediction error for snapshots made at most horizonSec (and more than the next shorter horizon) before
        the actual crossing.
      required:
      - horizonSec
      - sampleCount
      - eligibleCount
      - predictionCoverage
      - pairedSampleCount
      - confidenceSampleCount
    Headway:
      type: object
      properties:
        stopId:
          type: string
        routeId:
          type: string
        directionId:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        waitSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Seconds until the next vehicle is predicted to reach this stop, or null if none is currently predicted.
        gapsSec:
          type: array
          items:
            type: integer
            format: int32
          description: Observed gaps in seconds between the vehicles currently predicted at this stop, in arrival order.
        scheduledHeadwaySec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: 'The schedule''s own average headway at this stop, in seconds, for comparison: trips running that service
            day, from an hour before the first predicted arrival to an hour after the last (around now if none). Frequency-based
            trips are left out.'
      description: Current gap between consecutive vehicles serving a route/direction at a stop, compared to what the schedule
        calls for.
      required:
      - stopId
      - routeId
      - gapsSec
    StopPassage:
      type: object
      properties:
        tripId:
          type: string
        routeId:
          type: string
        blockId:
          anyOf:
          - type: string
          - type: 'null'
        serviceDate:
          type: string
          description: The calendar service date this trip execution is inferred to belong to, which for a late-night trip
            may be the day before the AVL activity was observed.
        stopId:
          type: string
        stopName:
          anyOf:
          - type: string
          - type: 'null'
        stopPathIndex:
          type: integer
          format: int32
          description: Index into the trip's stop sequence.
        scheduledSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Scheduled arrival (or departure, if no arrival is scheduled) in seconds since midnight of serviceDate.
        observedSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: When the vehicle was actually observed at this stop, in seconds since midnight of serviceDate, or null
            if never reached.
        adherenceSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Seconds behind (positive) or ahead of (negative) schedule when observed, or null if never reached.
            Not guaranteed to equal observedSec minus scheduledSec; see the interpolation note on the underlying match.
        vehicleId:
          type: string
          description: The vehicle that served this trip execution; shared by every passage in the group even when observedSec
            is null.
        direction:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: The trip's GTFS directionId, constant across every passage of this trip execution.
        occupancyStatus:
          anyOf:
          - $ref: '#/components/schemas/AvlOccupancyStatus'
          - type: 'null'
          description: Occupancy reported by the AVL ping that produced this passage's observedSec, or null if observedSec
            is null or the feed didn't report occupancy.
      description: One scheduled stop of one trip execution, as derived on-demand from AVL match history. observedSec/adherenceSec
        are null when the trip never reached this stop (by stopPathIndex) in the queried window.
      required:
      - tripId
      - routeId
      - serviceDate
      - stopId
      - stopPathIndex
      - vehicleId
    RouteAdherenceSummary:
      type: object
      properties:
        routeId:
          type: string
        routeShortName:
          anyOf:
          - type: string
          - type: 'null'
        sampleCount:
          type: integer
          format: int32
          description: Number of non-null adherence samples; a route with zero samples produces no summary at all.
        meanAdherenceSec:
          type: number
          format: double
        onTimePct:
          type: number
          format: double
          description: Percentage of samples within the on-time window, from 0 to 100.
      description: Aggregate schedule adherence for one route over a date range, from non-null StopPassage.adherenceSec samples.
      required:
      - routeId
      - sampleCount
      - meanAdherenceSec
      - onTimePct
    TripAdherenceSummary:
      type: object
      properties:
        tripId:
          type: string
        routeId:
          type: string
        serviceDate:
          type: string
        sampleCount:
          type: integer
          format: int32
        meanAdherenceSec:
          type: number
          format: double
        onTimePct:
          type: number
          format: double
      description: Aggregate schedule adherence for one trip execution (tripId + serviceDate) over a date range.
      required:
      - tripId
      - routeId
      - serviceDate
      - sampleCount
      - meanAdherenceSec
      - onTimePct
    TripPattern:
      type: object
      properties:
        patternKey:
          type: string
          description: Stable identifier for this pattern within its revision.
        routeId:
          type: string
        directionId:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        headsign:
          anyOf:
          - type: string
          - type: 'null'
          description: Representative headsign shared by this pattern's trips, if consistent.
        shapeId:
          anyOf:
          - type: string
          - type: 'null'
        stopCount:
          type: integer
          format: int32
          description: Number of scheduled stops in this pattern.
        lengthM:
          anyOf:
          - type: number
            format: double
          - type: 'null'
          description: Total pattern length in meters, from its shape.
        tripCount:
          type: integer
          format: int32
          description: Number of trips that follow this pattern.
        extent:
          anyOf:
          - $ref: '#/components/schemas/Extent'
          - type: 'null'
          description: Geographic bounding box of this pattern's shape.
        geometry:
          anyOf:
          - type: string
          - type: 'null'
          description: The pattern's whole polyline as a GeoJSON LineString (coordinates are [lng, lat]), gzip-compressed
            then base64-encoded; null if the pattern has fewer than two usable points.
      description: A distinct sequence of stops shared by one or more trips of a route, derived from the GTFS stop_times.
        Vehicles are matched against patterns rather than individual trips.
      required:
      - patternKey
      - routeId
      - stopCount
      - tripCount
    StopPath:
      type: object
      properties:
        stopPathIndex:
          type: integer
          format: int32
          description: Index of this stop within the pattern's stop sequence; used throughout the API (Vehicle, AvlReport,
            predictions) to refer to a position along a trip.
        stopId:
          type: string
        stopSeq:
          type: integer
          format: int32
          description: The original GTFS stop_sequence this stop path was derived from.
        lengthM:
          type: number
          format: double
          description: Distance in meters along the pattern's shape from the start of the trip to this stop.
        pickupType:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: GTFS pickup_type for this stop across the pattern's trips, if consistent.
        dropOffType:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        waitStop:
          type: boolean
          description: True if this is a scheduled waiting point (e.g. a layover) rather than a normal pass-through stop.
        scheduleAdherenceStop:
          type: boolean
          description: True if schedule adherence is meaningfully measured at this stop (e.g. a timepoint).
        layoverStop:
          type: boolean
          description: True if trips pause here for a scheduled break (e.g. a terminal layover) rather than just a brief dwell.
        breakTimeSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Scheduled break duration at this stop, in seconds, when layoverStop is true.
        typicalTravelTimeSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Typical observed or scheduled travel time from the previous stop, in seconds.
        typicalDwellTimeSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Typical observed or scheduled dwell time at this stop, in seconds.
        patternKey:
          type: string
          description: Key of the trip pattern this stop path belongs to.
      description: One scheduled stop within a trip pattern, with derived timing and geometry metadata shared by every trip
        that follows the pattern.
      required:
      - stopPathIndex
      - stopId
      - stopSeq
      - lengthM
      - waitStop
      - scheduleAdherenceStop
      - layoverStop
      - patternKey
    ScheduleTime:
      type: object
      properties:
        tripId:
          type: string
          description: GTFS trip_id this entry belongs to.
        stopPathIndex:
          type: integer
          format: int32
        arrivalSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Scheduled arrival in seconds since midnight of the trip's service day, or null if not scheduled at
            this stop.
        departureSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        interpolated:
          type: boolean
          description: True if this time was interpolated (the trip's own stop_times didn't specify it directly) rather than
            taken as-is from GTFS.
        schedTravelTimeSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Scheduled travel time from the previous stop, in seconds.
        schedDwellTimeSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
      description: Scheduled timing for one stop of one specific trip, as derived from its stop_times.
      required:
      - tripId
      - stopPathIndex
      - interpolated
    Block:
      type: object
      properties:
        id:
          type: string
          description: Internal row ID, distinct from blockId (which may repeat across services).
        blockId:
          type: string
        serviceId:
          type: string
        startTimeSec:
          type: integer
          format: int32
          description: Scheduled start of the block's first trip, in seconds since midnight.
        endTimeSec:
          type: integer
          format: int32
          description: Scheduled end of the block's last trip, in seconds since midnight.
        tripCount:
          type: integer
          format: int32
        routeIds:
          type: array
          items:
            type: string
          description: Every route served by a trip in this block.
      description: 'A vehicle block: the ordered sequence of trips one vehicle is scheduled to run on a given service day,
        derived from shared GTFS block_id.'
      required:
      - id
      - blockId
      - serviceId
      - startTimeSec
      - endTimeSec
      - tripCount
      - routeIds
    BlockTrip:
      type: object
      properties:
        listIndex:
          type: integer
          format: int32
          description: Position of this trip within the block, starting at 0.
        layoverAfterSec:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          description: Scheduled layover in seconds between this trip ending and the next one starting, or null for the block's
            last trip.
        deadheadAfter:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True if the vehicle must deadhead (travel out of service) to reach the next trip's start, or null if
            not determined.
        tripId:
          type: string
          description: GTFS trip_id of this trip.
        blockId:
          type: string
          description: blockId of the block this trip belongs to; with serviceId it identifies the block.
        serviceId: *id001
      description: One trip's position within its block's scheduled sequence.
      required:
      - listIndex
      - tripId
      - blockId
      - serviceId
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable application error code.
        currentVersion:
          type: integer
          format: int64
          description: Current draft version for stale edit conflicts.
        conflictingRecommendationIds:
          type: array
          items:
            type: string
      required:
      - title
      - status
  responses:
    Error400:
      description: Invalid parameters or request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: Conflict, including stale draft version or edit lock.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error500:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
