query FeedDetail($code: String!) {
  feed(code: $code) {
    code
    name
    description
    url
    pollingCron
    enabled
    source
    activeRevision {
      id
      status
      createdAt
      activatedAt
      feedStartDate
      feedEndDate
      byteSize
      contentSha256
      filesPresent
      rowCounts
      validationSummary {
        errorCount
        warningCount
        notices {
          rule
          severity
          count
          sample
        }
      }
    }
    revisions {
      id
      status
      createdAt
      activatedAt
      supersededAt
      feedStartDate
      feedEndDate
      byteSize
      contentSha256
      errorMessage
      validationSummary {
        errorCount
        warningCount
        notices {
          rule
          severity
          count
          sample
        }
      }
    }
  }
  feedInfo(feedCode: $code) {
    feedPublisherName
    feedPublisherUrl
    feedLang
    feedStartDate
    feedEndDate
    feedVersion
    feedContactEmail
    feedContactUrl
  }
}
