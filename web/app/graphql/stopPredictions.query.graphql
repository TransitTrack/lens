query StopBoard($feedCode: String!, $stopId: String!, $routeId: String, $directionId: Int, $algorithm: PredictionAlgorithm) {
  stopPredictions(
    feedCode: $feedCode
    stopId: $stopId
    routeId: $routeId
    directionId: $directionId
    algorithm: $algorithm
  ) {
    stopPathIndex
    scheduledArrival
    predictedArrival
    actualArrival
    algorithm
    confidenceSec
  }
}
