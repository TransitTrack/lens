fragment DraftEditResultF on DraftEditResult {
  draft { id version derivationStale lastValidation lock { editor expiresAt } }
  edit { seq op summary appliedAt undone }
  canUndo canRedo
}
mutation UpdateStopTime($input: UpdateStopTimeInput!) { updateStopTime(input: $input) { ...DraftEditResultF } }
mutation ShiftTrip($input: ShiftTripInput!) { shiftTrip(input: $input) { ...DraftEditResultF } }
mutation SetStopDwell($input: SetStopDwellInput!) { setStopDwell(input: $input) { ...DraftEditResultF } }
mutation AddTrip($input: AddTripInput!) { addTrip(input: $input) { ...DraftEditResultF } }
mutation DuplicateTrip($input: DuplicateTripInput!) { duplicateTrip(input: $input) { ...DraftEditResultF } }
mutation DeleteTrip($input: DeleteTripInput!) { deleteTrip(input: $input) { ...DraftEditResultF } }
mutation BulkShiftTrips($input: BulkShiftTripsInput!) { bulkShiftTrips(input: $input) { ...DraftEditResultF } }
mutation UndoDraftEdit($id: ID!, $editor: String!, $expectedVersion: Long!) { undoDraftEdit(id: $id, editor: $editor, expectedVersion: $expectedVersion) { ...DraftEditResultF } }
mutation RedoDraftEdit($id: ID!, $editor: String!, $expectedVersion: Long!) { redoDraftEdit(id: $id, editor: $editor, expectedVersion: $expectedVersion) { ...DraftEditResultF } }
