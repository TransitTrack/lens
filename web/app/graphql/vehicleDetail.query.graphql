query VehicleDetail($feedCode: String!, $vehicleId: String!) {
  vehicle(feedCode: $feedCode, vehicleId: $vehicleId) {
    vehicleId
    label
    reportTs
    position {
      lat
      lon
    }
    snappedPosition {
      lat
      lon
    }
    bearing
    speedMps
    occupancyStatus
    matched
    stale
    scheduleAdherenceSec
    stopPathIndex
    distanceAlongTripM
    currentStop {
      stopId
      stopName
      stopLat
      stopLon
    }
    block {
      blockId
      serviceId
      startTimeSec
      endTimeSec
      blockTrips {
        listIndex
        trip {
          tripId
          tripHeadsign
        }
      }
    }
    trip {
      tripId
      tripHeadsign
      directionId
      routeId
      startTimeSec
      endTimeSec
      route {
        routeShortName
        routeLongName
        routeColor
        routeTextColor
      }
      shape {
        geometry
      }
    }
    pattern {
      patternKey
      lengthM
      geometry
      stopPaths {
        stopPathIndex
        stopId
        waitStop
        lengthM
        scheduleAdherenceStop
        stop {
          stopId
          stopName
          stopLat
          stopLon
        }
      }
    }
  }
  vehiclePredictions(feedCode: $feedCode, vehicleId: $vehicleId) {
    stopPathIndex
    stop {
      stopId
      stopName
    }
    scheduledArrival
    scheduledDeparture
    predictedArrival
    predictedDeparture
    actualArrival
    actualDeparture
    actualReportGapSec
    actualReliable
    sourceReportTs
    algorithm
    confidenceSec
  }
  predictionAccuracy(feedCode: $feedCode) {
    algorithm
    sampleCount
    meanErrorSec
    meanAbsErrorSec
    eligibleCount
    predictionCoverage
    pairedSampleCount
    p90AbsErrorSec
    p95AbsErrorSec
    confidenceCoverage
    confidenceSampleCount
  }
}
