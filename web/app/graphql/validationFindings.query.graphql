query ValidationFindings($feedCode: String!, $entityType: String, $entityId: String) {
  validationFindings(feedCode: $feedCode, entityType: $entityType, entityId: $entityId) {
    ruleId
    title
    severity
    ruleClass
    entityType
    entityId
    serviceId
    file
    line
    field
    observedValue
    expectedValue
    details
    message
    remediation
  }
}
