query Vehicles($feedCode: String!, $matchedOnly: Boolean) {
  vehicles(feedCode: $feedCode, matchedOnly: $matchedOnly) {
    vehicleId
    label
    reportTs
    position {
      lat
      lon
    }
    bearing
    matched
    stale
    scheduleAdherenceSec
    stopPathIndex
    distanceAlongTripM
    speedMps
    pattern {
      lengthM
    }
    trip {
      routeId
      tripHeadsign
      route {
        routeShortName
        routeColor
        routeTextColor
      }
    }
  }
}
