query HeadwayInfo($feedCode: String!, $stopId: String!, $routeId: String!, $directionId: Int, $algorithm: PredictionAlgorithm) {
  headway(feedCode: $feedCode, stopId: $stopId, routeId: $routeId, directionId: $directionId, algorithm: $algorithm) {
    stopId
    routeId
    directionId
    waitSec
    gapsSec
    scheduledHeadwaySec
  }
}
