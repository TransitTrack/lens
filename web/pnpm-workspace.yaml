  - "@vitest/runner@4.1.12"
  - "@vitest/snapshot@4.1.12"
  - "@vitest/spy@4.1.12"
  - "@vitest/utils@4.1.12"
  - vitest@4.1.12
  - "@vue/language-core@3.3.14"
  - vue-tsc@3.3.14
  - mermaid@12.3.0
  - tailwindcss@4.3.5
  - playwright-core@1.65.0
