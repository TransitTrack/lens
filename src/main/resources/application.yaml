spring:
  application:
    name: transit-track
  graphql:
    graphiql:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_PORT_5432_TCP_ADDR:localhost}:${POSTGRES_PORT_5432_TCP_PORT:5432}/explorer
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true

transittrack:
  gtfs:
    download:
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
      max-size-bytes: 524288000
      user-agent: "transittrack-explorer/0.0.1"
    ingest:
      auto-activate: true
      strict-validation: false
      batch-size: 1000
      temp-dir: "/tmp"
    retention:
      keep-revisions-per-feed: 5
    polling:
      enabled: true
      sweep-cron: "0 * * * * *"
    prune-config-feeds: false
    feeds:
      - code: stpt
        name: stpt
        enabled: true                  # optional, default true
        auto-activate: true            # optional; overrides ingest.auto-activate
        pollingCron: "0 * * * * *"
        url: https://blues3.transitpdf.com/files/uran/improved-gtfs-timisoara/9c40c30a5815d3e3.zip

logging:
  pattern:
    level: '%5p'
    dateformat: MM-dd' 'HH:mm:ss
  level:
    eu.transittrack: debug
    root: warn
