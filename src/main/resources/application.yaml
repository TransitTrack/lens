spring:
  application:
    name: transit-track
  graphql:
    graphiql:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_PORT_5432_TCP_ADDR:localhost}:${POSTGRES_PORT_5432_TCP_PORT:5432}/explorer
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true

transittrack:
  http:
    connect-timeout-ms: 10000
    read-timeout-ms: 60000
    max-size-bytes: 524288000
    user-agent: "transittrack/0.0.1"
  feed:
    prune-config-feeds: false
    feeds:
      - code: stpt
        name: Societatea de transport public Timisoara
        enabled: true                  # optional, default true
        auto-activate: true            # optional; overrides gtfs.ingest.auto-activate
        polling-cron: "0 * * * * *"
        url: https://blues3.transitpdf.com/files/uran/improved-gtfs-timisoara/9c40c30a5815d3e3.zip
        avl:
          format: STPT
          url: https://live.stpt.ro/gtfs-vehicles.php
          prediction-algorithm: kalman
          prediction-mode: evaluation
  gtfs:
    ingest:
      auto-activate: true
      strict-validation: false
      batch-size: 1000
      temp-dir: "/tmp"
    retention:
      keep-revisions-per-feed: 5
    polling:
      enabled: true
      sweep-cron: "0 */15 * * * *"
    title-sanitizing:
      enabled: false
  schedule:
    enabled: true
    layover-threshold-sec: 60
    stop-projection-max-deviation-m: 100
  avl:
    enabled: true
    retention:
      report-hours: 24
      match-hours: 72
      stale-vehicle-hours: 12
      sweep-cron: "0 0 * * * *"
    match:
      backtrack-tolerance-m: 30.0
      max-deviation-m: 60.0
      unmatch-after-failures: 3
  predict:
    enabled: true
    learn:
      max-plausible-travel-time-sec: 1800
      kalman-measurement-noise-sec2: 400.0
      kalman-initial-variance-sec2: 3600.0
    retention:
      prediction-hours: 6
      accuracy-days: 30
      sweep-cron: "0 15 * * * *"

logging:
  pattern:
    level: '%5p'
    dateformat: dd-MM-YYYY' 'HH:mm:ss
    correlation: "[%X{traceId:-}%X{spanId:-}]"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-30.30logger{29}){cyan} %clr(:){faint} %m%n"
  level:
    eu.transittrack: debug
    root: warn
