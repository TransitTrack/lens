              - column: { name: from_leg_group_id, type: VARCHAR(255) }
              - column: { name: to_leg_group_id, type: VARCHAR(255) }
              - column: { name: transfer_count, type: INT }
              - column: { name: duration_limit, type: INT }
              - column: { name: duration_limit_type, type: SMALLINT }
              - column: { name: fare_transfer_type, type: SMALLINT }
              - column: { name: fare_product_id, type: VARCHAR(255) }
        - createIndex:
            indexName: ix_fare_xfer_rule_rev
            tableName: fare_transfer_rules
            columns: [ { column: { name: revision_id } } ]

        - createTable:
            tableName: areas
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_area_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: area_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: area_name, type: VARCHAR(255) }
        - addUniqueConstraint: { tableName: areas, columnNames: "revision_id, area_id", constraintName: uq_area_rev_id }

        - createTable:
            tableName: stop_areas
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_stop_area_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: area_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: stop_id, type: VARCHAR(255), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: stop_areas, columnNames: "revision_id, area_id, stop_id", constraintName: uq_stop_area_rev }

        - createTable:
