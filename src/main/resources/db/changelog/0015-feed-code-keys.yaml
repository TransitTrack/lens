              - column: { name: feed_code, type: VARCHAR(64) }
        - sql:
            sql: update vehicle_prediction t set feed_code = f.code from avl_feed f where f.id = t.feed_id
        - addNotNullConstraint: { tableName: vehicle_prediction, columnName: feed_code, columnDataType: VARCHAR(64) }
        - dropForeignKeyConstraint: { baseTableName: vehicle_prediction, constraintName: fk_vehicle_prediction_feed }
        - dropUniqueConstraint: { tableName: vehicle_prediction, constraintName: uq_vehicle_prediction_key }
        - dropIndex: { tableName: vehicle_prediction, indexName: ix_vehicle_prediction_vehicle }
        - dropColumn: { tableName: vehicle_prediction, columnName: feed_id }
        - addForeignKeyConstraint:
            baseTableName: vehicle_prediction
            baseColumnNames: feed_code
            constraintName: fk_vehicle_prediction_feed
            referencedTableName: avl_feed
            referencedColumnNames: code
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: vehicle_prediction
            columnNames: "feed_code, vehicle_id, trip_row_id, stop_path_index, algorithm"
            constraintName: uq_vehicle_prediction_key
        - createIndex:
            indexName: ix_vehicle_prediction_vehicle
            tableName: vehicle_prediction
            columns: [ { column: { name: feed_code } }, { column: { name: vehicle_id } }, { column: { name: trip_row_id } } ]

