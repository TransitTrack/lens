        - addNotNullConstraint: { tableName: prediction_accuracy, columnName: feed_code, columnDataType: VARCHAR(64) }
        - dropForeignKeyConstraint: { baseTableName: prediction_accuracy, constraintName: fk_prediction_accuracy_feed }
        - dropIndex: { tableName: prediction_accuracy, indexName: ix_prediction_accuracy_feed_algo_created }
        - dropColumn: { tableName: prediction_accuracy, columnName: feed_id }
