        - createIndex:
            indexName: ix_avl_stop_crossing_feed_revision_observed
            tableName: avl_stop_crossing
            columns: [ { column: { name: feed_code } }, { column: { name: revision_id } }, { column: { name: observed_at } } ]

  - changeSet:
      id: 0015-feed-code-keys-schedule-optimization-run
      author: transittrack
      comment: >
        schedule_optimization_run.feed_id is gtfs_feed.id, not avl_feed.id — a run analyzes one
        GTFS feed's frozen revision, unrelated to any AVL feed. No FK/index existed on this column
        before (deliberate — see 0013's comment), so none is added now either.
      changes:
        - addColumn:
            tableName: schedule_optimization_run
            columns:
              - column: { name: feed_code, type: VARCHAR(64) }
        - sql:
            sql: update schedule_optimization_run t set feed_code = f.code from gtfs_feed f where f.id = t.feed_id
        - addNotNullConstraint: { tableName: schedule_optimization_run, columnName: feed_code, columnDataType: VARCHAR(64) }
        - dropColumn: { tableName: schedule_optimization_run, columnName: feed_id }
