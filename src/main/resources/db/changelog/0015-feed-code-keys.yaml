        - dropForeignKeyConstraint: { baseTableName: avl_stop_crossing, constraintName: fk_avl_stop_crossing_feed }
        - dropIndex: { tableName: avl_stop_crossing, indexName: ix_avl_stop_crossing_feed_observed }
        - dropIndex: { tableName: avl_stop_crossing, indexName: ix_avl_stop_crossing_feed_revision_observed }
        - dropColumn: { tableName: avl_stop_crossing, columnName: feed_id }
        - addForeignKeyConstraint:
