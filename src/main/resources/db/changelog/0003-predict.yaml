databaseChangeLog:
  - changeSet:
      id: 0003-predict
      author: transittrack
      changes:
        - addColumn:
            tableName: avl_feed
            columns:
              - column: { name: prediction_algorithm, type: SMALLINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: prediction_mode, type: SMALLINT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - createTable:
            tableName: travel_time_observation
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: trip_pattern_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: stop_path_index, type: INT, constraints: { nullable: false } }
              - column: { name: sample_count, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: mean_sec, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: updated_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: travel_time_observation, columnNames: "trip_pattern_id, stop_path_index", constraintName: uq_travel_time_obs_pattern_idx }

        - createTable:
            tableName: kalman_travel_time_state
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: trip_pattern_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: stop_path_index, type: INT, constraints: { nullable: false } }
              - column: { name: estimate_sec, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: error_variance, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: sample_count, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: updated_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: kalman_travel_time_state, columnNames: "trip_pattern_id, stop_path_index", constraintName: uq_kalman_state_pattern_idx }

        - createTable:
            tableName: vehicle_prediction
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_vehicle_prediction_feed, references: "avl_feed(id)", deleteCascade: true } }
              - column: { name: vehicle_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: trip_row_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: block_pk, type: BIGINT }
              - column: { name: trip_pattern_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: stop_path_index, type: INT, constraints: { nullable: false } }
              - column: { name: algorithm, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: predicted_arrival_ts, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: predicted_departure_ts, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: actual_arrival_ts, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: actual_departure_ts, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: confidence_sec, type: INT }
              - column: { name: computed_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: vehicle_prediction, columnNames: "feed_id, vehicle_id, trip_row_id, stop_path_index, algorithm", constraintName: uq_vehicle_prediction_key }
        - createIndex:
            indexName: ix_vehicle_prediction_vehicle
            tableName: vehicle_prediction
            columns: [ { column: { name: feed_id } }, { column: { name: vehicle_id } }, { column: { name: trip_row_id } } ]
        - createIndex:
            indexName: ix_vehicle_prediction_pattern_stop
            tableName: vehicle_prediction
            columns: [ { column: { name: trip_pattern_id } }, { column: { name: stop_path_index } }, { column: { name: algorithm } } ]
        - createIndex:
            indexName: ix_vehicle_prediction_computed
            tableName: vehicle_prediction
            columns: [ { column: { name: computed_at } } ]

        - createTable:
            tableName: prediction_accuracy
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_prediction_accuracy_feed, references: "avl_feed(id)", deleteCascade: true } }
              - column: { name: vehicle_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: trip_row_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: stop_path_index, type: INT, constraints: { nullable: false } }
              - column: { name: algorithm, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: predicted_ts, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: actual_ts, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: error_sec, type: INT, constraints: { nullable: false } }
              - column: { name: abs_error_sec, type: INT, constraints: { nullable: false } }
              - column: { name: created_at, type: "TIMESTAMP WITH TIME ZONE", defaultValueComputed: "now()", constraints: { nullable: false } }
        - createIndex:
            indexName: ix_prediction_accuracy_feed_algo_created
            tableName: prediction_accuracy
            columns: [ { column: { name: feed_id } }, { column: { name: algorithm } }, { column: { name: created_at } } ]
