              - column: { name: rider_category_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: rider_category_name, type: VARCHAR(255) }
              - column: { name: is_default_fare_category, type: SMALLINT }
              - column: { name: eligibility_url, type: TEXT }
        - addUniqueConstraint: { tableName: gtfs_rider_category, columnNames: "revision_id, rider_category_id", constraintName: uq_rider_cat_rev_id }

