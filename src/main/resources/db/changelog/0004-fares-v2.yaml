              - column: { name: fare_product_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: fare_product_name, type: VARCHAR(255) }
              - column: { name: rider_category_id, type: VARCHAR(255) }
              - column: { name: fare_media_id, type: VARCHAR(255) }
              - column: { name: amount, type: "DOUBLE PRECISION" }
              - column: { name: currency, type: VARCHAR(8) }
        - sql:
            sql: "CREATE UNIQUE INDEX uq_fare_product ON gtfs_fare_product (revision_id, fare_product_id, coalesce(rider_category_id,''), coalesce(fare_media_id,''))"

