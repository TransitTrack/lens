databaseChangeLog:
  - changeSet:
      id: 0007-optimization-runs
      author: transittrack
      changes:
        - createTable:
            tableName: schedule_optimization_run
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: observed_from, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: observed_to, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: minimum_samples, type: INT, constraints: { nullable: false } }
              - column: { name: state, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: created_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
        - createTable:
            tableName: schedule_optimization_recommendation
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: run_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_optimization_recommendation_run, references: "schedule_optimization_run(id)", deleteCascade: true } }
              - column: { name: kind, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: sample_count, type: INT, constraints: { nullable: false } }
              - column: { name: delta_sec, type: INT, constraints: { nullable: false } }
              - column: { name: reason, type: TEXT, constraints: { nullable: false } }
        - createIndex:
            tableName: schedule_optimization_recommendation
            indexName: ix_optimization_recommendation_run
            columns: [ { column: { name: run_id } }, { column: { name: id } } ]
  - changeSet:
      id: 0007-optimization-runs-filters-lifecycle-status
      author: transittrack
      changes:
        - addColumn:
            tableName: schedule_optimization_run
            columns:
              - column: { name: service_id, type: TEXT }
              - column: { name: route_id, type: TEXT }
              - column: { name: direction_id, type: INT }
              - column: { name: window_from_sec, type: INT }
              - column: { name: window_to_sec, type: INT }
              - column: { name: started_at, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: completed_at, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: error, type: TEXT }
        - addColumn:
            tableName: schedule_optimization_recommendation
            columns:
              - column: { name: status, type: VARCHAR(16), defaultValue: PENDING, constraints: { nullable: false } }
              - column: { name: current_value, type: JSONB }
              - column: { name: proposed_value, type: JSONB }
              - column: { name: evidence, type: JSONB }
              - column: { name: conflict_key, type: TEXT }
        - createIndex:
            tableName: schedule_optimization_recommendation
            indexName: ix_optimization_recommendation_run_status
            columns: [ { column: { name: run_id } }, { column: { name: status } }, { column: { name: id } } ]
