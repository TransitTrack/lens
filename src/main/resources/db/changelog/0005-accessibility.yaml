databaseChangeLog:
  - changeSet:
      id: 0005-gtfs-pathway
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_pathway
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_pathway_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: pathway_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: from_stop_id, type: VARCHAR(255) }
              - column: { name: to_stop_id, type: VARCHAR(255) }
              - column: { name: pathway_mode, type: SMALLINT }
              - column: { name: is_bidirectional, type: SMALLINT }
              - column: { name: length, type: "DOUBLE PRECISION" }
              - column: { name: traversal_time, type: INT }
              - column: { name: stair_count, type: INT }
              - column: { name: max_slope, type: "DOUBLE PRECISION" }
              - column: { name: min_width, type: "DOUBLE PRECISION" }
              - column: { name: signposted_as, type: VARCHAR(255) }
              - column: { name: reversed_signposted_as, type: VARCHAR(255) }
        - addUniqueConstraint: { tableName: gtfs_pathway, columnNames: "revision_id, pathway_id", constraintName: uq_pathway_rev_id }
        - createIndex:
            indexName: ix_pathway_rev
            tableName: gtfs_pathway
            columns: [ { column: { name: revision_id } } ]

  - changeSet:
      id: 0005-gtfs-level
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_level
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_level_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: level_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: level_index, type: "DOUBLE PRECISION" }
              - column: { name: level_name, type: VARCHAR(255) }
        - addUniqueConstraint: { tableName: gtfs_level, columnNames: "revision_id, level_id", constraintName: uq_level_rev_id }

  - changeSet:
      id: 0005-gtfs-location-group
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_location_group
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_locgroup_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: location_group_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: location_group_name, type: VARCHAR(255) }
        - addUniqueConstraint: { tableName: gtfs_location_group, columnNames: "revision_id, location_group_id", constraintName: uq_locgroup_rev_id }

  - changeSet:
      id: 0005-gtfs-location-group-stop
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_location_group_stop
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_locgroupstop_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: location_group_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: stop_id, type: VARCHAR(255), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: gtfs_location_group_stop, columnNames: "revision_id, location_group_id, stop_id", constraintName: uq_locgroupstop_rev }

  - changeSet:
      id: 0005-gtfs-location
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_location
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_location_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: location_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: stop_name, type: VARCHAR(500) }
              - column: { name: stop_desc, type: TEXT }
              - column: { name: geometry, type: JSONB, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: gtfs_location, columnNames: "revision_id, location_id", constraintName: uq_location_rev_id }

  - changeSet:
      id: 0005-gtfs-booking-rule
      author: transittrack
      changes:
        - createTable:
            tableName: gtfs_booking_rule
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_booking_rule_rev, references: "gtfs_revision(id)", deleteCascade: true } }
              - column: { name: booking_rule_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: booking_type, type: SMALLINT }
              - column: { name: prior_notice_duration_min, type: INT }
              - column: { name: prior_notice_duration_max, type: INT }
              - column: { name: prior_notice_last_day, type: INT }
              - column: { name: prior_notice_last_time, type: INT }
              - column: { name: prior_notice_start_day, type: INT }
              - column: { name: prior_notice_start_time, type: INT }
              - column: { name: prior_notice_service_id, type: VARCHAR(255) }
              - column: { name: message, type: TEXT }
              - column: { name: pickup_message, type: TEXT }
              - column: { name: drop_off_message, type: TEXT }
              - column: { name: phone_number, type: VARCHAR(64) }
              - column: { name: info_url, type: TEXT }
              - column: { name: booking_url, type: TEXT }
        - addUniqueConstraint: { tableName: gtfs_booking_rule, columnNames: "revision_id, booking_rule_id", constraintName: uq_booking_rule_rev_id }
