name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: ktlint (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Backend Kotlin/Kotlin-Gradle formatting - ktlint runs under Spotless (see build.gradle.kts).
      # Not gated with --no-daemon's usual -x test here: spotlessCheck doesn't touch tests at all.
      - name: Run spotlessCheck
        id: spotless
        run: ./gradlew spotlessCheck --no-daemon

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.spotless.outcome }}" = "success" ]; then
            echo "### ktlint: all files formatted ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ktlint: formatting violations found ❌"
              echo ""
              echo "Run \`./gradlew spotlessApply\` locally and commit the result."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  eslint:
    name: eslint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run eslint
        id: eslint
        run: pnpm run lint

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.eslint.outcome }}" = "success" ]; then
            echo "### eslint: no issues ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### eslint: issues found ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
