name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers needs Docker, which is preinstalled and running on GitHub-hosted
      # ubuntu-latest runners - no extra setup required.
      - name: Run tests
        id: test
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(f).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          passed = tests - failures - errors - skipped
          summary = f"### Backend tests: {passed}/{tests} passed"
          if failures or errors:
              summary += f" ({failures} failed, {errors} errors)"
          if skipped:
              summary += f", {skipped} skipped"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary + "\n")
          PYEOF

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          retention-days: 14

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run vitest
        id: test
        run: pnpm run test

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "### Frontend tests: passed ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Frontend tests: failed ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
