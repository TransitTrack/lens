name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter creates a check run with the results, which needs `checks: write`.
permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend tests (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers needs Docker, which is preinstalled and running on GitHub-hosted
      # ubuntu-latest runners - no extra setup required. continue-on-error so the reporter step
      # below still runs (and shows which tests failed) instead of the job aborting here.
      - name: Run tests
        id: test
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend tests (JUnit)
          path: build/test-results/test/*.xml
          reporter: java-junit
          # Defaults to true - this is what actually fails the job on a real test failure,
          # not the (continue-on-error'd) gradle step above.

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          retention-days: 14

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run vitest
        id: test
        run: pnpm exec vitest run --reporter=junit --outputFile=test-results/junit.xml
        continue-on-error: true

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Frontend tests (vitest)
          path: web/test-results/junit.xml
          reporter: java-junit
