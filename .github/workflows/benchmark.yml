name: Benchmark

# The full kotlinx-benchmark suite (docs/benchmarks.md) boots a real Spring context + Testcontainers
# Postgres per benchmark class and takes a couple of minutes - too slow to gate every push/PR. So:
# every push/PR just runs the fast smokeBenchmark check (~30s, one class, one iteration) as a
# "the pipeline still runs end to end" sanity check, and the full suite + HTML report run weekly
# (or on demand via workflow_dispatch) for real performance numbers/trends.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # full suite weekly, Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full benchmark suite instead of the smoke check"
        type: boolean
        default: false

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke benchmark
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run smoke benchmark
        run: ./gradlew smokeBenchmark --no-daemon

      - name: Summary
        if: always()
        run: |
          echo "### Smoke benchmark: pipeline ran end to end ✅" >> "$GITHUB_STEP_SUMMARY"

  full:
    name: Full benchmark suite
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full benchmark suite
        run: ./gradlew benchmark --no-daemon

      - name: Render HTML report
        run: ./gradlew benchmarkReport --no-daemon

      - name: Summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, json, os
          files = sorted(glob.glob("build/reports/benchmarks/main/*/benchmark.json"))
          if not files:
              raise SystemExit(0)
          with open(files[-1]) as f:
              results = json.load(f)
          lines = ["### Benchmark results", "", "| Benchmark | Params | Score |", "| --- | --- | --- |"]
          for r in results:
              name = r["benchmark"].rsplit(".", 1)[-1]
              params = ", ".join(f"{k}={v}" for k, v in r.get("params", {}).items())
              metric = r["primaryMetric"]
              lines.append(f"| {name} | {params} | {metric['score']:.3f} {metric['scoreUnit']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            build/reports/benchmarks/main/
            build/reports/benchmarks/html/
          retention-days: 90
