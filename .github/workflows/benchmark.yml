name: Benchmark

# The full kotlinx-benchmark suite (docs/benchmarks.md) boots a real Spring context + Testcontainers
# Postgres per benchmark class and takes a couple of minutes. It runs on every push/PR (not just a
# schedule) because kitlangton/jmh-benchmark-action needs that cadence to do its job: on a PR it
# comments a before/after comparison against main's saved baseline, and on a push to main it updates
# that baseline (stored on a separate `internal/benchmark-data` branch the action manages itself).
# A quick smokeBenchmark run gates the expensive full suite so a broken pipeline fails in ~30s
# instead of after a full ~2min run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents:write - the action pushes updated baseline data to internal/benchmark-data on a push
# event. pull-requests:write - the action comments the comparison on a PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: JMH benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke check (fail fast before the full suite)
        run: ./gradlew smokeBenchmark --no-daemon

      - name: Run full benchmark suite
        run: ./gradlew benchmark --no-daemon

      # kotlinx-benchmark writes to a timestamped directory per run. The comparison action only
      # accepts bare time units (for example, `ms`), while JMH reports per-operation units such as
      # `ms/op`; it also identifies parameterized rows by `benchmark` alone. Keep the raw report
      # untouched for the artifact/HTML view, and give the action a normalized copy with each
      # parameter set encoded in its benchmark name.
      - name: Prepare JMH output for comparison
        run: |
          latest=$(find app/build/reports/benchmarks/main -name benchmark.json -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          jq '
            map(
              (.params // {} | to_entries | sort_by(.key) | map("\(.key)=\(.value)") | join(", ")) as $params |
              .benchmark += (if $params == "" then "" else " [\($params)]" end) |
              .primaryMetric.scoreUnit |= sub("/op$"; "")
            )
          ' "$latest" > app/build/benchmark-comparison.json

      # Render + upload before the benchmark-comparison action: on a push event, that action
      # commits its updated baseline by checking out `internal/benchmark-data` in this same
      # working directory and leaves it checked out. That branch predates the app/ module split
      # (it's rooted at the repo's very first commit), so app/build.gradle.kts - and the
      # benchmarkReport task it defines - no longer exist on disk once the action has run,
      # which fails `./gradlew benchmarkReport` with exit code 1. Neither step below depends on
      # the action's output, so running them first keeps them on the real checkout.
      - name: Render HTML report
        if: always()
        run: ./gradlew benchmarkReport --no-daemon

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            app/build/reports/benchmarks/main/
            app/build/reports/benchmarks/html/
          retention-days: 90

      - name: JMH Benchmark Action
        uses: kitlangton/jmh-benchmark-action@v0.1.1
        with:
          jmh-output-path: app/build/benchmark-comparison.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
