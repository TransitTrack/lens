name: Build & publish

# Builds the backend jar/image, the frontend image, and packages the Helm chart. Every push and PR
# builds and Trivy-scans both images (catching a broken Dockerfile or a newly-introduced image
# vulnerability before merge); only a push to main or a `v*` tag actually pushes anything to GHCR,
# so a PR never needs registry credentials at all.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute lowercase image name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      # Jib's -Djib.to.tags wants a bare comma-separated tag list, not the full image refs
      # docker/metadata-action produces (it's designed for docker/build-push-action instead).
      - name: Format tags for Jib
        id: jib-tags
        run: |
          prefix='${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:'
          csv=$(echo '${{ steps.meta.outputs.tags }}' | sed "s|^$prefix||" | paste -sd, -)
          echo "tags=$csv" >> "$GITHUB_OUTPUT"

      # Built via Jib (see the `jib {}` block in build.gradle.kts) instead of the Dockerfile, so
      # the published image is multi-arch (amd64+arm64) without Docker/QEMU: JVM bytecode is
      # platform-independent, so Jib just assembles the same app layers against each platform's
      # base-image variant - no emulated compile needed. jibBuildTar can't emit a multi-platform
      # tarball though, so this scan-only build is forced to amd64 via the jib.from.platforms
      # override; the real push further down builds every configured platform.
      - name: Build image tarball (amd64, for scanning)
        run: |
          ./gradlew jibBuildTar --no-daemon \
            -Djib.from.platforms=linux/amd64 \
            -Djib.to.image="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}" \
            -Djib.to.tags="${{ steps.jib-tags.outputs.tags }}"

      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: build/jib-image.tar
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0" # report-only for now; see docs/ci.md before flipping to '1'

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif
          category: trivy-backend-image

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-image-sarif
          path: trivy-backend-image.sarif
          retention-days: 14

      # Jib pushes straight to the registry - no `docker login`/`docker push` or local daemon
      # needed; auth goes through Jib's own system properties instead.
      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew jib --no-daemon \
            -Djib.to.image="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}" \
            -Djib.to.tags="${{ steps.jib-tags.outputs.tags }}" \
            -Djib.to.auth.username="${{ github.actor }}" \
            -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-web" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      # Needed to build the arm64 layer under emulation on this (amd64) runner - the Node build
      # here is light enough that emulation overhead is a non-issue, unlike the backend's Gradle
      # compile (see backend-image above, which sidesteps emulation entirely via Jib instead).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Build+load locally first, single-platform (amd64, whatever matches the runner), so Trivy
      # can scan it below regardless of whether this run is allowed to push - multi-platform
      # builds can't be `--load`ed into the local daemon. Pushing the real multi-arch manifest, if
      # this event is allowed to, is a separate step further down so the image is never built
      # twice for amd64.
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-frontend-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image.sarif
          category: trivy-frontend-image

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-frontend-image-sarif
          path: trivy-frontend-image.sarif
          retention-days: 14

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch manifest lists can't be produced by `docker push`ing a locally loaded image
      # (that's single-platform by construction) - buildx builds+pushes amd64 and arm64 directly
      # here instead.
      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/lens

      - name: Template (render sanity check)
        run: helm template lens deploy/helm/lens > /dev/null

      # Tag push (vX.Y.Z) -> that exact chart version. Otherwise (main / PR / manual) -> the
      # version already in Chart.yaml suffixed with the short SHA, so every build is distinguishable
      # without permanently bumping Chart.yaml on every commit.
      - name: Determine chart version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            echo "chart_version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(grep '^version:' deploy/helm/lens/Chart.yaml | awk '{print $2}')
            echo "chart_version=${base}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: |
          mkdir -p dist
          helm package deploy/helm/lens \
            --version "${{ steps.version.outputs.chart_version }}" \
            --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 90

      - name: Compute lowercase OCI repository
        if: github.event_name != 'pull_request'
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart
        if: github.event_name != 'pull_request'
        run: helm push dist/*.tgz oci://${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/charts
