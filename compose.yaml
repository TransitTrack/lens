services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: explorer
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: always
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/explorer?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./docker/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    # ports:
    #   - "9187:9187"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # ports:
    #   - "8081:8080"
  prometheus:
    image: prom/prometheus:v3
    restart: always
    depends_on:
      - postgres-exporter
      - cadvisor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # ports:
    #   - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "4000:3000"

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
