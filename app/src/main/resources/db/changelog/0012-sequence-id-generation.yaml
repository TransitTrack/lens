        - createSequence: { sequenceName: schedule_optimization_run_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('schedule_optimization_run_seq', greatest((select coalesce(max(id), 0) from schedule_optimization_run), 1), (select count(*) from schedule_optimization_run) > 0)
        - sql: alter table schedule_optimization_run alter column id drop identity if exists
