        - sql: alter table vehicle_state alter column id drop identity if exists
        - sql: alter table vehicle_state alter column id set default nextval('vehicle_state_seq')

        - createSequence: { sequenceName: vehicle_prediction_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('vehicle_prediction_seq', greatest((select coalesce(max(id), 0) from vehicle_prediction), 1), (select count(*) from vehicle_prediction) > 0)
        - sql: alter table vehicle_prediction alter column id drop identity if exists
        - sql: alter table vehicle_prediction alter column id set default nextval('vehicle_prediction_seq')

        - createSequence: { sequenceName: travel_time_observation_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('travel_time_observation_seq', greatest((select coalesce(max(id), 0) from travel_time_observation), 1), (select count(*) from travel_time_observation) > 0)
        - sql: alter table travel_time_observation alter column id drop identity if exists
