databaseChangeLog:
  - changeSet:
      id: 0012-sequence-id-generation
      author: transittrack
      comment: >
        Every one of these tables used GENERATED BY DEFAULT AS IDENTITY, which forces Hibernate to
        read each generated key back immediately and so silently disables the JDBC insert batching
        already configured (hibernate.jdbc.batch_size=100). Switch each to a dedicated pooled
        SEQUENCE (allocationSize/incrementBy = 50, matching eu.transittrack.gtfs.model.RevisionScoped's
        existing gtfs_entity_seq pattern) so Hibernate can batch inserts again. The new sequence is
        seeded from the current max(id) before the identity property is dropped, so existing rows
        and their ids are untouched. The column keeps a DEFAULT nextval(...) after dropping IDENTITY
        so raw SQL that never names `id` (AvlWriter/PredictionWriter's native upserts, and a couple
        of test fixture inserts) keeps working exactly as it did under IDENTITY.
      changes:
        - createSequence: { sequenceName: gtfs_feed_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('gtfs_feed_seq', greatest((select coalesce(max(id), 0) from gtfs_feed), 1), (select count(*) from gtfs_feed) > 0)
        - sql: alter table gtfs_feed alter column id drop identity if exists
        - sql: alter table gtfs_feed alter column id set default nextval('gtfs_feed_seq')

        - createSequence: { sequenceName: gtfs_revision_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('gtfs_revision_seq', greatest((select coalesce(max(id), 0) from gtfs_revision), 1), (select count(*) from gtfs_revision) > 0)
        - sql: alter table gtfs_revision alter column id drop identity if exists
        - sql: alter table gtfs_revision alter column id set default nextval('gtfs_revision_seq')

        - createSequence: { sequenceName: avl_feed_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('avl_feed_seq', greatest((select coalesce(max(id), 0) from avl_feed), 1), (select count(*) from avl_feed) > 0)
        - sql: alter table avl_feed alter column id drop identity if exists
        - sql: alter table avl_feed alter column id set default nextval('avl_feed_seq')

        - createSequence: { sequenceName: avl_report_seq, startValue: 1, incrementBy: 50 }
