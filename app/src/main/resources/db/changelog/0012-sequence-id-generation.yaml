        - createSequence: { sequenceName: schedule_optimization_recommendation_seq, startValue: 1, incrementBy: 50 }
        - sql: select setval('schedule_optimization_recommendation_seq', greatest((select coalesce(max(id), 0) from schedule_optimization_recommendation), 1), (select count(*) from schedule_optimization_recommendation) > 0)
        - sql: alter table schedule_optimization_recommendation alter column id drop identity if exists
        - sql: alter table schedule_optimization_recommendation alter column id set default nextval('schedule_optimization_recommendation_seq')

        # DraftEdit's own PK sequence was allocationSize=1 (no batching benefit); bump it to the
        # same pooled size. Unrelated to draft_edit's app-level `seq` column, which stays exactly
        # sequential per revision via DraftEditService's own findByRevisionIdOrderBySeqAsc logic.
        - sql: alter sequence draft_edit_seq increment by 50
