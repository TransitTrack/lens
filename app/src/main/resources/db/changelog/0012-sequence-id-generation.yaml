        - sql: alter table vehicle_match alter column id drop identity if exists
        - sql: alter table vehicle_match alter column id set default nextval('vehicle_match_seq')

        - createSequence: { sequenceName: vehicle_state_seq, startValue: 1, incrementBy: 50 }
