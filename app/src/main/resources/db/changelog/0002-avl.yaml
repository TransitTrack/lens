databaseChangeLog:
  - changeSet:
      id: 0002-avl
      author: transittrack
      changes:
        - createTable:
            tableName: avl_feed
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: gtfs_feed_code, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: url, type: TEXT, constraints: { nullable: false } }
              - column: { name: format, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: poll_interval_sec, type: INT, constraints: { nullable: false } }
              - column: { name: assignment_mode, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: headers, type: JSONB }
              - column: { name: source, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: last_poll_at, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: last_poll_status, type: VARCHAR(255) }
              - column: { name: last_poll_report_count, type: INT }
              - column: { name: created_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: updated_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }

        - createTable:
            tableName: avl_report
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_avl_report_feed, references: "avl_feed(id)", deleteCascade: true } }
              - column: { name: vehicle_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: vehicle_label, type: VARCHAR(255) }
              - column: { name: ts, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: lat, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: lon, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: bearing, type: DOUBLE PRECISION }
              - column: { name: speed_mps, type: DOUBLE PRECISION }
              - column: { name: odometer_m, type: DOUBLE PRECISION }
              - column: { name: desc_trip_id, type: VARCHAR(255) }
              - column: { name: desc_route_id, type: VARCHAR(255) }
              - column: { name: desc_direction_id, type: SMALLINT }
              - column: { name: desc_start_date, type: DATE }
              - column: { name: desc_start_time_sec, type: INT }
              - column: { name: desc_schedule_relationship, type: SMALLINT }
              - column: { name: current_stop_sequence, type: INT }
              - column: { name: current_stop_id, type: VARCHAR(255) }
              - column: { name: current_status, type: SMALLINT }
              - column: { name: occupancy_status, type: SMALLINT }
              - column: { name: congestion_level, type: SMALLINT }
              - column: { name: match_status, type: SMALLINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: matched_at, type: "TIMESTAMP WITH TIME ZONE" }
              - column: { name: created_at, type: "TIMESTAMP WITH TIME ZONE", defaultValueComputed: "now()", constraints: { nullable: false } }
        - createIndex:
            indexName: ix_avl_report_feed_vehicle_ts
            tableName: avl_report
            columns: [ { column: { name: feed_id } }, { column: { name: vehicle_id } }, { column: { name: ts, descending: true } } ]
        - createIndex:
            indexName: ix_avl_report_claim
            tableName: avl_report
            columns: [ { column: { name: match_status } }, { column: { name: id } } ]
        - createIndex:
            indexName: ix_avl_report_created
            tableName: avl_report
            columns: [ { column: { name: created_at } } ]

        - createTable:
            tableName: vehicle_match
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: avl_report_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_vehicle_match_report, references: "avl_report(id)", deleteCascade: true } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: vehicle_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: ts, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: revision_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trip_row_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: block_pk, type: BIGINT }
              - column: { name: trip_pattern_id, type: BIGINT }
              - column: { name: stop_path_index, type: INT, constraints: { nullable: false } }
              - column: { name: distance_along_trip_m, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: deviation_m, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: schedule_adherence_sec, type: INT }
              - column: { name: snapped_lat, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: snapped_lon, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: heading, type: DOUBLE PRECISION }
              - column: { name: score, type: DOUBLE PRECISION }
              - column: { name: created_at, type: "TIMESTAMP WITH TIME ZONE", defaultValueComputed: "now()", constraints: { nullable: false } }
        - createIndex:
            indexName: ix_vehicle_match_feed_vehicle_ts
            tableName: vehicle_match
            columns: [ { column: { name: feed_id } }, { column: { name: vehicle_id } }, { column: { name: ts, descending: true } } ]
        - createIndex:
            indexName: ix_vehicle_match_created
            tableName: vehicle_match
            columns: [ { column: { name: created_at } } ]

        - createTable:
            tableName: vehicle_state
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: feed_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: vehicle_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: vehicle_label, type: VARCHAR(255) }
              - column: { name: report_ts, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: lat, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: lon, type: DOUBLE PRECISION, constraints: { nullable: false } }
              - column: { name: bearing, type: DOUBLE PRECISION }
              - column: { name: speed_mps, type: DOUBLE PRECISION }
              - column: { name: occupancy_status, type: SMALLINT }
              - column: { name: matched, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: stale, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: consecutive_failures, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: revision_id, type: BIGINT }
              - column: { name: trip_row_id, type: BIGINT }
              - column: { name: block_pk, type: BIGINT }
              - column: { name: trip_pattern_id, type: BIGINT }
              - column: { name: stop_path_index, type: INT }
              - column: { name: distance_along_trip_m, type: DOUBLE PRECISION }
              - column: { name: schedule_adherence_sec, type: INT }
              - column: { name: snapped_lat, type: DOUBLE PRECISION }
              - column: { name: snapped_lon, type: DOUBLE PRECISION }
              - column: { name: updated_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: vehicle_state, columnNames: "feed_id, vehicle_id", constraintName: uq_vehicle_state_feed_vehicle }
        - createIndex:
            indexName: ix_vehicle_state_feed_updated
            tableName: vehicle_state
            columns: [ { column: { name: feed_id } }, { column: { name: updated_at } } ]
